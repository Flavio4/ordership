# Configuración de despliegue en Railway (tiene prioridad sobre lo que se configure en el panel)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway no pasa el tráfico a una versión nueva hasta que este endpoint responda 2xx.
# Si la versión nueva no arranca (ej: falta una variable), sigue atendiendo la anterior.
healthcheckPath = "/actuator/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
