spring.application.name=ordership

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:OrderShipSecretKeyThatIsLongEnoughForHS256AlgorithmMinimum32Bytes!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}    

# ── CORS ─────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── Default Admin (created on first startup) ─────────────
app.admin.email=${ADMIN_EMAIL:admin@ordership.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
