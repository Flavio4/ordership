spring.application.name=ordership

# Configuración base = producción. Los secretos no tienen valor por defecto:
# si falta la variable de entorno, la app no arranca.
# Para desarrollo local usar el perfil "dev" (application-dev.properties).

# Railway (y otros hostings) asignan el puerto en la variable PORT
server.port=${PORT:8080}

# ── Logs ─────────────────────────────────────────────────
# Una línea JSON por log (formato logstash: campos "message" y "level", que Railway reconoce para filtrar)
logging.structured.format.console=logstash

# ── Actuator ─────────────────────────────────────────────
# Solo /actuator/health, público y sin detalles. Incluye la conexión a la base: si Postgres no responde
# devuelve 503. Lo usan Railway (antes de cada despliegue) y el monitor externo (UptimeRobot).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ── JPA / Hibernate ──────────────────────────────────────
# Hibernate no modifica el schema: solo verifica al arrancar que coincida con las entidades.
# Los cambios de estructura se hacen con migraciones Flyway en src/main/resources/db/migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=app

# ── Flyway ───────────────────────────────────────────────
spring.flyway.schemas=app
spring.flyway.default-schema=app

# ── JWT ──────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# ── CORS ─────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ── Default Admin (created on first startup) ─────────────
# ADMIN_PASSWORD solo es obligatorio mientras el admin no exista en la base.
app.admin.email=${ADMIN_EMAIL:admin@ordership.com}
app.admin.password=${ADMIN_PASSWORD:}

# ── Shopify webhooks ──────────────────────────────────────
# Sin secret configurado, los webhooks se rechazan (salvo que se permitan explícitamente sin firma).
app.shopify.webhook-secret=${SHOPIFY_WEBHOOK_SECRET:}
app.shopify.allow-unsigned-webhooks=false
# Ítems de pedido que no son productos (extras del formulario de Releasit), separados por coma.
# No se crean en el catálogo ni mueven stock; su importe igual se cobra (va en el monto a cobrar).
app.shopify.ignored-line-items=${SHOPIFY_IGNORED_LINE_ITEMS:Envio Prioritario y Garantia Extendida}
