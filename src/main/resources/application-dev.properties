# Perfil de desarrollo local. Activar con SPRING_PROFILES_ACTIVE=dev
# NUNCA usar este perfil en producción: contiene secretos conocidos.

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ── Logs ─────────────────────────────────────────────────
# En local, logs en texto normal (más fáciles de leer que JSON)
logging.structured.format.console=

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ───────────────────────────────────────────────
# Bases locales creadas antes de Flyway (con ddl-auto=update): se marcan como V1 sin ejecutarlo.
# En producción NO se habilita: una base con tablas pero sin historial de Flyway debe fallar, no adivinarse.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ── JWT ──────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:OrderShipSecretKeyThatIsLongEnoughForHS256AlgorithmMinimum32Bytes!}

# ── CORS ─────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── Default Admin ────────────────────────────────────────
app.admin.password=${ADMIN_PASSWORD:admin123}

# ── Shopify webhooks ──────────────────────────────────────
# Permite probar con curl sin firma cuando SHOPIFY_WEBHOOK_SECRET no está definido.
app.shopify.allow-unsigned-webhooks=true
